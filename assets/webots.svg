<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Webots: 4 merged pull requests in the C++ renderer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="258" rx="16"/></clipPath>
    <style>
      .glow { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .10; } 50% { opacity: .22; } }
    </style>
  </defs>
  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <rect x="1" y="1" width="1198" height="258" rx="16" fill="url(#bg)" stroke="#c084fc" stroke-opacity="0.45" stroke-width="1.5"/>
    <g clip-path="url(#card)">
      <circle class="glow" cx="1160" cy="30" r="90" fill="#c084fc"/>
      <rect x="1" y="1" width="720" height="4" fill="url(#edge)"/>
    </g>
    <text x="32" y="58" font-size="26" font-weight="700" fill="#f1f5f9">Webots</text>
    <text x="134" y="58" font-size="16" fill="#94a3b8">open-source robot simulator, C++ renderer (WREN)</text>
    <rect x="1000" y="34" width="168" height="32" rx="16" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-opacity="0.6"/>
    <text x="1084" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#4ade80">4 PRs merged</text>
    <text x="32" y="94" font-size="15" fill="#64748b">my fixes:</text>
    <circle cx="44" cy="128" r="5" fill="#4ade80"/><text x="60" y="133" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#c084fc">#7036</text><text x="122" y="133" font-size="16" fill="#cbd5e1">fix duplicate light intensity scaling in PBR diffuse lighting</text><circle cx="44" cy="158" r="5" fill="#4ade80"/><text x="60" y="163" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#c084fc">#7043</text><text x="122" y="163" font-size="16" fill="#cbd5e1">fix stale camera culling after reading a WREN matrix</text><circle cx="44" cy="188" r="5" fill="#4ade80"/><text x="60" y="193" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#c084fc">#7047</text><text x="122" y="193" font-size="16" fill="#cbd5e1">don&#x27;t build mesh normals while loading a world</text><circle cx="44" cy="218" r="5" fill="#4ade80"/><text x="60" y="223" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#c084fc">#7048</text><text x="122" y="223" font-size="16" fill="#cbd5e1">merge identical vertices of static meshes</text>
  </g>
</svg>
