<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="JOSA Hackathon: local medical assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="198" rx="16"/></clipPath>
    <style>
      .glow { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .10; } 50% { opacity: .22; } }
    </style>
  </defs>
  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <rect x="1" y="1" width="1198" height="198" rx="16" fill="url(#bg)" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.5"/>
    <g clip-path="url(#card)">
      <circle class="glow" cx="1160" cy="30" r="90" fill="#fbbf24"/>
      <rect x="1" y="1" width="720" height="4" fill="url(#edge)"/>
    </g>
    <text x="32" y="58" font-size="26" font-weight="700" fill="#f1f5f9">Local medical assistant</text>
    <rect x="352" y="36" width="150" height="28" rx="14" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="427" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">JOSA Hackathon</text>
    <text x="32" y="98" font-size="16" fill="#cbd5e1">Helps doctors read patient records, organize their data and look up medical research.</text>
    <text x="32" y="124" font-size="16" fill="#cbd5e1">Local OCR, an LLM agent that searches PubMed over MCP. Started on Qwen3 4B in Ollama, then DeepSeek.</text>
    <rect x="32" y="150" width="78" height="28" rx="14" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.55"/><text x="71.0" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#4ade80">FastAPI</text><rect x="118" y="150" width="95" height="28" rx="14" fill="#60a5fa" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.55"/><text x="165.5" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#60a5fa">PaddleOCR</text><rect x="221" y="150" width="70" height="28" rx="14" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.55"/><text x="256.0" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#22d3ee">OpenCV</text><rect x="299" y="150" width="46" height="28" rx="14" fill="#c084fc" fill-opacity="0.14" stroke="#c084fc" stroke-opacity="0.55"/><text x="322.0" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#c084fc">MCP</text><rect x="353" y="150" width="70" height="28" rx="14" fill="#94a3b8" fill-opacity="0.14" stroke="#94a3b8" stroke-opacity="0.55"/><text x="388.0" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">Ollama</text><rect x="431" y="150" width="103" height="28" rx="14" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.55"/><text x="482.5" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#f472b6">OpenRouter</text>
  </g>
</svg>
