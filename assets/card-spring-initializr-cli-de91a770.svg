" height="112" rx="6" fill="#07090D" stroke="#1E2731"></rect><text x="28.0" y="60.0" class="gm" font-size="10.5" fill="#EDE6DD">$ spring-init new demo --preset web</text><text x="28.0" y="77.0" class="gm" font-size="10.5" fill="#8F8A86">  resolving metadata… cached ✓</text><text x="28.0" y="94.0" class="gm" font-size="10.5" fill="#D2CCC5">  wrote demo.zip  (Boot 3.5 · Java 21)</text><text x="28.0" y="113.0" class="gm" font-size="10.5" fill="#EDE6DD">$ spring-init deps --json | jq length</text><text x="28.0" y="130.0" class="gm" font-size="10.5" fill="#3FD0FF">  214</text><rect x="28" y="136" width="7" height="2" fill="#3FD0FF"></rect><text x="15.0" y="190.0" class="cg" font-size="28" fill="#E9C2A8">Spring Boot from the terminal</text><text x="16.0" y="214.0" class="gm" font-size="12.5" fill="#D2CCC5">A CLI for start.spring.io with presets, JSON output</text><text x="16.0" y="233.0" class="gm" font-size="12.5" fill="#D2CCC5">for scripts, and a metadata cache so it still works</text><text x="16.0" y="252.0" class="gm" font-size="12.5" fill="#D2CCC5">on a flaky network.</text><line x1="16" x2="399.0" y1="270" y2="270" stroke="#2C2B2D" stroke-dasharray="2 4"></line><text x="16.0" y="290.0" class="sy" font-size="7.5" fill="#3FD0FF" letter-spacing="1.5">PYTHON · 14 TESTS · CI ON LINUX + WINDOWS</text></svg>
