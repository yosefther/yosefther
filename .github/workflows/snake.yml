name: Snake

# Draws the contribution-graph snake and publishes it to the `output` branch.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF2B1C&color_dots=#160404,#3A0B08,#7A1A12,#C0261A,#FF2B1C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFC9BD&color_dots=#160404,#3A0B08,#7A1A12,#C0261A,#FF2B1C

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
